<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#171717"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262626" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Logo -->
  <g transform="translate(520, 180)">
    <rect width="64" height="64" rx="12" fill="#FAFAFA"/>
    <path d="M16 24L32 16L48 24V40L32 48L16 40V24Z" stroke="#171717" stroke-width="3" fill="none"/>
    <path d="M32 16V48M16 24L48 40M48 24L16 40" stroke="#171717" stroke-width="3"/>
  </g>
  
  <!-- Company name -->
  <text x="600" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#FAFAFA" text-anchor="middle">Innovexle</text>
  
  <!-- Headline -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#FAFAFA" text-anchor="middle">We build systems that scale.</text>
  
  <!-- Subtext -->
  <text x="600" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#A3A3A3" text-anchor="middle">Backend engineering for companies that can't afford downtime.</text>
</svg>
